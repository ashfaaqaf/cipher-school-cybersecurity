name: Deploy to InfinityFree

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infinityfree-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.INFINITYFREE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: infinityfree-production
      url: ${{ vars.INFINITYFREE_SITE_URL }}
    env:
      SITE_URL: ${{ vars.INFINITYFREE_SITE_URL }}
      FTP_SERVER: ${{ secrets.INFINITYFREE_FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
      FTP_REMOTE_DIR: ${{ vars.INFINITYFREE_REMOTE_DIR || '/htdocs' }}
      EXPECTED_FTP_USERNAME: ${{ vars.INFINITYFREE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check deployment settings
        shell: bash
        run: |
          if [[ "$SITE_URL" != "https://cipherschool.page.gd" ]]; then
            echo "Deployment stopped: the public site must be https://cipherschool.page.gd"
            exit 1
          fi

          for setting in FTP_SERVER FTP_USERNAME FTP_PASSWORD EXPECTED_FTP_USERNAME; do
            if [[ -z "${!setting}" ]]; then
              echo "Deployment stopped: $setting is missing."
              exit 1
            fi
          done

          if [[ "$FTP_SERVER" != "ftpupload.net" ]]; then
            echo "Deployment stopped: the FTP server is not InfinityFree."
            exit 1
          fi

          if [[ "$FTP_USERNAME" != "$EXPECTED_FTP_USERNAME" ]]; then
            echo "Deployment stopped: the FTP username does not match the approved account."
            exit 1
          fi

          if [[ "$FTP_REMOTE_DIR" != "/htdocs" ]]; then
            echo "Deployment stopped: the remote directory must be exactly /htdocs."
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Check production output
        shell: bash
        run: |
          test -s out/index.html
          test -s out/manifest.webmanifest
          grep -q "Cipher School" out/index.html

      - name: Save a rollback copy
        uses: actions/upload-artifact@v4
        with:
          name: cipher-school-${{ github.sha }}
          path: out/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Install FTP client
        run: sudo apt-get update && sudo apt-get install --yes lftp

      - name: Publish built site
        shell: bash
        run: |
          lftp <<LFTP_COMMANDS
          set cmd:fail-exit yes
          set ftp:passive-mode true
          set net:max-retries 10
          set net:timeout 30
          set net:reconnect-interval-base 5
          set net:reconnect-interval-multiplier 1
          set net:reconnect-interval-max 10
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER"
          cd "$FTP_REMOTE_DIR"
          # Content-hashed assets only need uploading when their name or size
          # changes. Skipping timestamp-only differences avoids InfinityFree's
          # intermittent locks on unchanged icons and fonts.
          mirror --reverse --no-perms --verbose --parallel=1 --ignore-time --exclude-glob '*.png' --exclude-glob index.html --exclude-glob sw.js out/ .
          # InfinityFree intermittently locks existing PNG names after a delete.
          # Do not replace stable brand art on every release. Repair the 192px
          # icon if a previous interrupted upload left it missing, then verify it.
          set cmd:fail-exit no
          put -O . out/cipher-school-icon-192.png
          set cmd:fail-exit yes
          # Publish the entry page after its assets, then the worker last. A new
          # worker must never precache the previous release's index.html.
          put -O . out/index.html
          put -O . out/sw.js
          cls -1 cipher-school-icon-192.png
          bye
          LFTP_COMMANDS
